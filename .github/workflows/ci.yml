name: CI

on:
  push:
    # This repository's default branch is master. Until the Phase 3H
    # follow-up this list said only [main], so pushes never triggered CI.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The C++ jobs pin clang 19 and the runner image: libstdc++ only exposes
# std::expected (flowforge::Result, used throughout) to clang >= 19, and
# Ubuntu 24.04's default clang is 18 -- the first CI run ever failed with
# "no member named 'unexpected' in namespace 'std'". Pinning the runner
# keeps a runner-label migration from silently changing the toolchain.
jobs:
  cpp-build-test:
    name: C++ build + test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev cmake ninja-build libpq-dev tesseract-ocr

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DFLOWFORGE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  cpp-sanitizers:
    name: C++ ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev cmake ninja-build libpq-dev tesseract-ocr

      - name: Configure
        run: |
          cmake -B build-san -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFLOWFORGE_ENABLE_ASAN=ON \
            -DFLOWFORGE_ENABLE_UBSAN=ON \
            -DFLOWFORGE_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
          POSTGRES_DB: flowforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLOWFORGE_TEST_DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge_test
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev cmake ninja-build libpq-dev tesseract-ocr postgresql-client

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Validate the migration runner against a fresh, disposable database
        # Fresh apply, schema/constraint/FK/index checks, idempotent re-run,
        # and a deliberately broken migration that must abort non-zero
        # without being recorded (see tests/integration/check-migrations.sh).
        run: |
          PGPASSWORD=flowforge createdb -h localhost -U flowforge flowforge_migcheck
          ./tests/integration/check-migrations.sh
        env:
          FLOWFORGE_CHECK_DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge_migcheck

      - name: Run migrations against the test database
        run: ./scripts/db-migrate.sh
        env:
          FLOWFORGE_DATABASE_URL: postgres://flowforge:flowforge@localhost:5432/flowforge_test

      - name: Configure (and confirm PostgreSQL support is actually enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFLOWFORGE_BUILD_BENCHMARKS=OFF \
            -DFLOWFORGE_WARNINGS_AS_ERRORS=ON | tee /tmp/configure.log
          grep -q "PostgreSQL support:  ON" /tmp/configure.log

      - name: Build
        run: cmake --build build -j

      - name: Run engine + server tests (in-memory and PostgreSQL-backed)
        run: ctest --test-dir build --output-on-failure

  cpp-format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format
      - name: Check formatting
        run: |
          files=$(find engine apps/server benchmarks -name '*.cpp' -o -name '*.hpp')
          clang-format --dry-run --Werror $files

  frontend:
    name: Dashboard lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint --workspace=apps/dashboard
      - run: npm run typecheck --workspace=apps/dashboard
      - run: npm run build --workspace=apps/dashboard

  docker-validate:
    name: Docker build + runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build images
        run: docker compose build

      - name: Start PostgreSQL and apply migrations
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm migrate

      - name: Start server + dashboard and wait for their healthchecks
        run: docker compose up -d --wait --wait-timeout 180 server dashboard

      - name: Smoke test the running stack (real HTTP, real PostgreSQL, real OCR)
        run: python3 tests/e2e/smoke-test.py --api-url http://localhost:8080 --dashboard-url http://localhost:3000 --ocr

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
